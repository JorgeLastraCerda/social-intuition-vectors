model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  dtype: "bfloat16"
  device: "cuda"
  # Native TransformerLens, matching the broad hiring-steering sweep (git 0e0547a)
  # and the "TL" backend recorded for this model in tab:models.
  backend: "transformer-lens"

generation:
  model: "claude-haiku-4-5-20251001"
  max_tokens: 300
  temperature: 1.0
  max_retries: 5
  requests_per_minute: 50

probing:
  probe_layer_frac: 0.66
  n_topics: 100
  stories_per_topic: 12
  start_token: 50
  seed: 20260527

steering:
  strengths: [0.0, 0.25, 0.5, 1.0]

paths:
  papers: "literature/"
  raw_data: "data/raw/"
  stimuli: "data/stimuli/"
  processed: "data/processed/"
  results: "results/"
  logs: "results/logs/"

neutral:
  corpus_path: "data/stimuli/neutral_corpus.jsonl"
  source_dataset: "wikimedia/wikipedia"
  source_config: "20231101.en"
  n_texts: 1500
  min_words: 90
  max_words: 200
  variance_threshold: 0.50

smoke:
  label: "llama31_8b_local"
  n_topics: 10
  expected_layers: 32
  expected_d_model: 4096
  min_free_vram_gib: 24.0
  max_vram_fraction: 0.90
